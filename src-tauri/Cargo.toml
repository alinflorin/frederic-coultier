[package]
name = "frederic-coultier"
version = "0.1.1"
description = "Frederic Coultier desktop app"
authors = ["Alin-Florin Ciu"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "frederic_coultier_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
openrscad-syntax = { git = "https://github.com/matthova/openrscad", tag = "v0.14.0", version = "0.14.0" }
openrscad-eval = { git = "https://github.com/matthova/openrscad", tag = "v0.14.0", version = "0.14.0" }
openrscad-geom = { git = "https://github.com/matthova/openrscad", tag = "v0.14.0", version = "0.14.0" }
zip = { version = "9.0.3", default-features = false, features = ["deflate"] }
tauri-plugin-dialog = "2.8.3"
thiserror = "2.0.21"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-process = "2.4.0"
tauri-plugin-updater = "2.14.0"

[dev-dependencies]
tempfile = "3.27.0"
