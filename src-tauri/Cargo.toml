[package]
name = "frederic-coultier"
version = "0.4.5"
description = "Frederic Coultier desktop app"
authors = ["Alin-Florin Ciu"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "frederic_coultier_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "9.0.3", default-features = false, features = ["deflate"] }
tauri-plugin-dialog = "2.8.3"
thiserror = "2.0.21"
manifold-csg = "0.3"
meshopt-rs = { version = "0.1.2", features = ["experimental"] }
tauri-plugin-store = "2.5.0"
regex = "1"
rmcp = { version = "3.5", features = ["server", "macros", "transport-streamable-http-server"] }
axum = "0.8"
tokio = { version = "1", features = ["net", "process", "sync", "time"] }
tokio-util = "0.7"
include_dir = "0.7.4"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-process = "2.4.0"
tauri-plugin-updater = "2.14.0"

[dev-dependencies]
tower = "0.5"
tempfile = "3.27.0"
